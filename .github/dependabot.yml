# Dependabot: weekly grouped minor/patch updates; majors arrive as separate PRs for review.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
    groups:
      github_actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
