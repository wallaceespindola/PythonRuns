[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonruns"
version = "0.1.0"
description = "Python tests and proofs of concept"
authors = [
    { name = "Wallace Espindola", email = "wallace.espindola@gmail.com" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyjwt>=2.10.1",
    "argparse==1.4.0",
    "asteval>=1.0.9",
    "build==1.2.1",
    "click==8.1.7",
    "coverage==7.5.4",
    "faker==26.0.0",
    "jax>=0.4.0",
    "jpype1==1.5.0",
    "jupyterlab>=4.5.9",
    "lxml>=6.1.0",
    "matplotlib>=3.9.0",
    "mediapipe>=0.10.20",
    "mock==5.1.0",
    "numpy>=2.3.0",
    "opencv-contrib-python>=4.11.0.86",
    "opencv-python>=4.10.0.84",
    "pandas>=2.2.2",
    "paramiko>=4.0.0",
    "pathlib==1.0.1",
    "pdf2docx==0.5.8",
    "pillow>=13.0.0",
    "pip-check==2.8.1",
    "pre-commit==4.1.0",
    "progress==1.6",
    "protobuf>=5.29.6",
    "psutil==6.0.0",
    "psycopg2-binary>=2.9.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "qrcode==7.4.2",
    "rembg>=2.0.75",
    "requests>=2.33.0,<3.0.0",
    "secretstorage>=3.3.0",
    "sentencepiece>=0.2.1",
    "setuptools>=84.1.0",
    "shortuuid==1.0.13",
    "sounddevice==0.5.2",
    "tqdm>=4.67.1",
    "twine==6.2.0",
    "unittest-xml-reporting==3.2.0",
    "urllib3>=2.8.0",
    "wheel>=0.46.2",
    "toml>=0.10.2,<0.11.0",
]

[project.urls]
Homepage = "https://github.com/wallaceespindola"
Repository = "https://github.com/wallaceespindola/PythonRuns"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.0.0",
    "ruff>=0.4.0",
    "black>=26.3.1",
    "isort>=5.13.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
packages = ["pythonruns", "output", "resources", "scripts", "tests"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
log_cli = true

[tool.pre-commit]
hook-config = { python = "python3" }

[tool.setuptools.package-data]
output = ["*.csv", "*.docx", "*.png"]
resources = ["*.jpeg", "*.pdf", "*.png"]
scripts = ["*.sh", "*.py"]
tests = ["*.py"]
