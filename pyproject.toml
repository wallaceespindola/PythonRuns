[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonruns"
version = "0.1.0"
description = "Python tests and proofs of concept"
authors = [
    { name = "Wallace Espindola", email = "wallace.espindola@gmail.com" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faker>=26.0.0",
    "matplotlib>=3.9.0",
    "numpy>=2.3.0",
    "opencv-python>=4.10.0.84",
    "pandas>=2.2.2",
    "paramiko>=4.0.0",
    "pdf2docx>=0.5.8",
    "pillow>=13.0.0",
    "progress>=1.6",
    "psycopg2-binary>=2.9.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.2",
    "qrcode>=7.4.2",
    "rembg>=2.0.75",
    "requests>=2.33.0,<3.0.0",
    "secretstorage>=3.3.0",
    "shortuuid>=1.0.13",
    "tqdm>=4.67.1",
    "urllib3>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/wallaceespindola"
Repository = "https://github.com/wallaceespindola/PythonRuns"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "build>=1.2.1",
    "coverage>=7.5.4",
    "isort>=5.13.0",
    "mypy>=1.0.0",
    "pre-commit>=4.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.0.0",
    "ruff>=0.4.0",
    "twine>=6.2.0",
]

[tool.setuptools]
packages = ["pythonruns", "output", "resources", "scripts", "tests"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
log_cli = true

[tool.pre-commit]
hook-config = { python = "python3" }

[tool.setuptools.package-data]
output = ["*.csv", "*.docx", "*.png"]
resources = ["*.jpeg", "*.pdf", "*.png"]
scripts = ["*.sh", "*.py"]
tests = ["*.py"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
